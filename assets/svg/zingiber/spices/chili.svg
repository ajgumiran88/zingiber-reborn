<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 300" width="120" height="300">
  <!-- Dried Kashmiri chilli: glossy creased skin curving to a hooked tip under a wavy calyx. -->
  <defs>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0" stop-color="#3a0606"/>
      <stop offset=".3" stop-color="#7d1612"/>
      <stop offset=".52" stop-color="#b52b1e"/>
      <stop offset=".72" stop-color="#861913"/>
      <stop offset="1" stop-color="#2e0404"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8944"/>
      <stop offset="1" stop-color="#3a3615"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#1a0202" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0202" stop-opacity=".5"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="crease" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".2 .02" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 .12  0 0 0 0 .01  0 0 0 0 .01  1.8 0 0 0 -.86"/>
    </filter>
    <path id="b" d="M46 52C36 90 34 140 32 180c-2 35-6 70 8 108 4-26 16-62 20-102 6-46 18-94 18-134-8-8-24-8-32 0Z"/>
    <clipPath id="body"><use href="#b"/></clipPath>
  </defs>
  <use href="#b" fill="url(#skin)"/>
  <g clip-path="url(#body)">
    <rect width="120" height="300" filter="url(#crease)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M48 66c-6 54-10 104-12 164" stroke="#240303" stroke-width="1.3" opacity=".45"/>
      <path d="M70 66c-4 54-12 114-24 184" stroke="#240303" stroke-width="1.1" opacity=".4"/>
      <path d="M62 64c-2 52-8 110-18 170" stroke="#ef6a52" stroke-width=".9" opacity=".28"/>
      <path d="M38 118c7 5 18 5 28-1M36 160c8 4 18 3 26-3M36 210c6 3 12 2 18-3" stroke="#240303" stroke-width="1" opacity=".32"/>
      <path d="M54 66c-4 48-8 88-12 130-3 32-6 56-4 76" stroke="#ffd2c2" stroke-width="4.5" opacity=".4" filter="url(#soft)"/>
    </g>
    <rect width="120" height="300" fill="url(#tip)"/>
  </g>
  <path d="M44 58c-2-12 6-20 18-20s20 8 18 20c-4-4-8 2-14-2-4 6-10 0-14 4-4-4-6 0-8-2Z" fill="url(#cap)"/>
  <path d="M48 48c6-6 20-7 28 0" fill="none" stroke="#c9c47c" stroke-width="1.2" opacity=".5" stroke-linecap="round"/>
  <path d="M62 40c0-12 4-24 14-32" fill="none" stroke="#5a5626" stroke-width="5" stroke-linecap="round"/>
  <path d="M61 34c1-9 4-17 11-23" fill="none" stroke="#b0ab68" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
</svg>
