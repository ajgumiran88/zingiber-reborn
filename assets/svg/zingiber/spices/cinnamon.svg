    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .55" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .08  0 0 0 0 .03  2 0 0 0 -.84"/>
