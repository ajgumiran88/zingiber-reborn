      <path d="M20 40.6c80-5 170-4 260-2" stroke="#3e1a08" stroke-width="1.2" opacity=".5"/>
      <path d="M94 26c-2 12-1 25 1 37M182 25c-2 13-1 26 1 38" stroke="#3e1a08" stroke-width="1.3" opacity=".3"/>
      <path d="M96 27c-2 11-1 23 1 35M184 26c-2 12-1 24 1 36" stroke="#efc08a" stroke-width=".8" opacity=".3"/>
    </g>
  </g>
  <ellipse cx="19" cy="45" rx="5.5" ry="17" fill="#5a2a10"/>
  <path d="M19 31c-4 3-4 10 0 11 3 1 3-4 0-4M19 59c-4-3-4-10 0-11 3-1 3 4 0 4" fill="none" stroke="#b97c44" stroke-width="1.1" stroke-linecap="round"/>
