      <stop offset="0" stop-color="#d6a064"/>
      <stop offset=".2" stop-color="#b8743a"/>
      <stop offset=".52" stop-color="#93501f"/>
      <stop offset=".85" stop-color="#673113"/>
      <stop offset="1" stop-color="#4a220c"/>
    </linearGradient>
    <radialGradient id="face" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#e6b27a"/>
      <stop offset="1" stop-color="#a05a28"/>
