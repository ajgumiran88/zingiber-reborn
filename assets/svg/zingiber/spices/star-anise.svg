<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Star anise: eight carpels, each split open on a glossy seed; one light source top-left. -->
  <defs>
    <linearGradient id="hull" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b190c"/>
      <stop offset=".45" stop-color="#7a3a1d"/>
      <stop offset=".8" stop-color="#94502a"/>
      <stop offset="1" stop-color="#5b2a14"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#140600" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#140600" stop-opacity="0"/>
      <stop offset="1" stop-color="#140600" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="seed" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#e8ad6c"/>
      <stop offset=".45" stop-color="#a8622f"/>
      <stop offset="1" stop-color="#4f240f"/>
    </radialGradient>
    <radialGradient id="boss" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#9a5a30"/>
      <stop offset="1" stop-color="#2e1308"/>
    </radialGradient>
    <radialGradient id="light" cx=".3" cy=".25" r=".9">
      <stop offset="0" stop-color="#ffdcae" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#ffdcae" stop-opacity="0"/>
      <stop offset="1" stop-color="#120500" stop-opacity=".5"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 .16  0 0 0 0 .06  0 0 0 0 .02  1.3 0 0 0 -.62"/>
    </filter>
    <path id="h" d="M100 103C82 90 75 53 100 13c25 40 18 77 0 90Z"/>
    <g id="c">
      <use href="#h" fill="url(#hull)"/>
      <use href="#h" fill="url(#side)"/>
      <path d="M100 87c-6-9-8-31 0-53 8 22 6 44 0 53Z" fill="#250d05"/>
      <ellipse cx="100" cy="58" rx="5.4" ry="10.5" fill="url(#seed)"/>
      <ellipse cx="98.3" cy="53.2" rx="1.4" ry="3.2" fill="#fff2dc" opacity=".6"/>
      <path d="M100 13c-15 30-16 59-6 81" fill="none" stroke="#c98650" stroke-width="1.1" opacity=".5"/>
    </g>
    <clipPath id="all">
      <use href="#h"/>
      <use href="#h" transform="rotate(45 100 100) translate(100 100) scale(.93) translate(-100 -100)"/>
      <use href="#h" transform="rotate(90 100 100)"/>
      <use href="#h" transform="rotate(135 100 100) translate(100 100) scale(.96) translate(-100 -100)"/>
      <use href="#h" transform="rotate(180 100 100) translate(100 100) scale(.9) translate(-100 -100)"/>
      <use href="#h" transform="rotate(225 100 100)"/>
      <use href="#h" transform="rotate(270 100 100) translate(100 100) scale(.94) translate(-100 -100)"/>
      <use href="#h" transform="rotate(315 100 100) translate(100 100) scale(.97) translate(-100 -100)"/>
    </clipPath>
  </defs>
  <use href="#c"/>
  <use href="#c" transform="rotate(45 100 100) translate(100 100) scale(.93) translate(-100 -100)"/>
  <use href="#c" transform="rotate(90 100 100)"/>
  <use href="#c" transform="rotate(135 100 100) translate(100 100) scale(.96) translate(-100 -100)"/>
  <use href="#c" transform="rotate(180 100 100) translate(100 100) scale(.9) translate(-100 -100)"/>
  <use href="#c" transform="rotate(225 100 100)"/>
  <use href="#c" transform="rotate(270 100 100) translate(100 100) scale(.94) translate(-100 -100)"/>
  <use href="#c" transform="rotate(315 100 100) translate(100 100) scale(.97) translate(-100 -100)"/>
  <g clip-path="url(#all)">
    <rect width="200" height="200" filter="url(#grain)" opacity=".7"/>
    <rect width="200" height="200" fill="url(#light)"/>
  </g>
  <circle cx="100" cy="100" r="10" fill="url(#boss)"/>
  <circle cx="97" cy="97" r="2.6" fill="#e6b07a" opacity=".45"/>
</svg>
