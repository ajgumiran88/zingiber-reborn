<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- One wrinkled black peppercorn; the page floats it at several depths. -->
  <defs>
    <radialGradient id="corn" cx=".36" cy=".32" r=".72">
      <stop offset="0" stop-color="#7a685a"/>
      <stop offset=".42" stop-color="#2c221c"/>
      <stop offset="1" stop-color="#0c0907"/>
    </radialGradient>
    <filter id="wrinkle" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pits" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .42  1.6 0 0 0 -.9"/>
    </filter>
    <clipPath id="ball"><circle cx="30" cy="30" r="22"/></clipPath>
  </defs>
  <g filter="url(#wrinkle)">
    <circle cx="30" cy="30" r="22" fill="url(#corn)"/>
    <g clip-path="url(#ball)">
      <rect width="60" height="60" filter="url(#pits)" opacity=".55"/>
    </g>
  </g>
  <ellipse cx="23" cy="21" rx="4.5" ry="3" fill="#f2e6d8" opacity=".28"/>
</svg>
